name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Nuxt-Typen vorbereiten
        run: npx nuxi prepare

      - name: Formatierung, ESLint und Tests prüfen
        run: npm run check

      - name: Produktionsbuild prüfen
        run: npm run build
